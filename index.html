<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Titanium 27 — Coming Soon</title>
  <meta name="description" content="Titanium 27 is docking soon. Stay tuned." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Gruppo&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=28" />
</head>
<body>
  <main class="stage" id="stage">
    <!-- deep-space haze underneath, then twinkling, drifting stars and the occasional shooting star -->
    <div class="nebula" aria-hidden="true"></div>
    <canvas id="sky" class="sky" aria-hidden="true"></canvas>

    <!-- the backdrop video: the huge ring turning above the planet (muted, looping) -->
    <div class="bg" id="bg" aria-hidden="true">
      <video class="backdrop" src="assets/backdrop.mp4?v=2" poster="assets/backdrop-poster.jpg" autoplay muted loop playsinline preload="auto"></video>
    </div>

    <!-- the logo: real silver artwork, with a highlight that sweeps across the metal -->
    <div class="logo" id="logo" role="img" aria-label="Titanium 2027">
      <img src="assets/logo-titanium.png?v=6" alt="" />
      <div class="logo-shine"></div>
    </div>

    <!-- coming soon -->
    <section class="cs" id="cs">
      <h1 class="cs-title" id="csTitle" aria-label="Coming Soon"><span class="cs-text" id="csText" aria-hidden="true">Coming Soon</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
      <div class="energy" id="energy" aria-hidden="true"></div>
    </section>

    <!-- sound: browsers only allow audio after a click, so this turns it on and replays the entrance in sync -->
    <button class="snd" id="snd" type="button" aria-pressed="false" aria-label="Turn sound on">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/>
        <g class="snd-on" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
        </g>
        <g class="snd-off" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M16 9.5l5 5M21 9.5l-5 5"/>
        </g>
      </svg>
    </button>
    <!-- finishing grade: soft vignette + fine film grain -->
    <div class="grade" aria-hidden="true"></div>
  </main>

  <script src="main.js?v=29"></script>
</body>
</html>
