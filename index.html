<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Titanium 27 — Coming Soon</title>
  <meta name="description" content="Titanium 27 is docking soon. Stay tuned." />
  <link rel="preload" as="image" href="assets/logo-titanium.png?v=3" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Gruppo&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>
  <main class="stage" id="stage">
    <!-- deep space: nebula haze, then stars + drifting dust -->
    <div class="nebula" aria-hidden="true"></div>
    <canvas id="stars" class="stars" aria-hidden="true"></canvas>

    <!-- the galaxy: a slowly turning spiral behind the title (looping video) -->
    <video class="galaxy" id="galaxy" src="assets/galaxy.mp4" poster="assets/galaxy-poster.jpg"
           autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>

    <!-- coming soon -->
    <section class="cs" id="cs">
      <h1 class="cs-title" id="csTitle">Coming Soon<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></h1>
      <div class="energy" id="energy" aria-hidden="true"></div>
    </section>

    <!-- deep space flight, seen through a TITANIUM-shaped window -->
    <div class="hero-glow" id="heroGlow">
      <div class="hero" id="hero">
        <!-- "camera": everything inside moves together (slow zero-g roll) -->
        <div class="cam" id="cam">
          <canvas class="hero-stars" id="heroStars" aria-hidden="true"></canvas>
        </div>
        <!-- the real logo artwork (silver, bevelled), sized and placed exactly like the cutout -->
        <div class="hero-logo" id="heroLogo"></div>
        <div class="hero-fill" id="heroFill"></div>
      </div>
    </div>

    <!-- anamorphic lens flare that fires when the title locks in -->
    <div class="flare" id="flare" aria-hidden="true"></div>

    <!-- effects layer: hyperspace streaks -->
    <canvas id="fx" class="fx" aria-hidden="true"></canvas>

    <!-- HUD shown only on the opening frame -->
    <div class="hud" id="hud" aria-hidden="true">
      <div class="visor"></div>
      <div class="hud-frame"></div>
      <div class="hud-tl">TITANIUM 27</div>
      <div class="hud-tr">WARP DRIVE · ENGAGED</div>
      <div class="hud-bl">13.0827° N · 80.2707° E</div>
      <div class="hud-br"><span id="vel">0.00</span> c</div>
    </div>

    <!-- sound: browsers only allow audio after a click, so this turns it on and replays in sync -->
    <button class="snd" id="snd" type="button" aria-pressed="false" aria-label="Turn sound on">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/>
        <g class="snd-on" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/>
        </g>
        <g class="snd-off" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M16 9.5l5 5M21 9.5l-5 5"/>
        </g>
      </svg>
    </button>
    <!-- finishing grade: soft vignette + fine film grain -->
    <div class="grade" aria-hidden="true"></div>
  </main>

  <script src="main.js?v=3"></script>
</body>
</html>
